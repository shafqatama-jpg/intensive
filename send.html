<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send learner details | Kings Driving Centre</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#11402A">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#11402A;color:#0F1F17;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{color:#fff;font-size:1.5rem;margin:0 0 6px}
.lead{color:rgba(255,255,255,.85);margin:0 0 18px}
.card{background:#F5F3EA;border:4px solid #fff;border-radius:16px;padding:16px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
textarea{width:100%;min-height:290px;font:inherit;font-size:16px;padding:12px;border:2px solid rgba(15,31,23,.25);border-radius:8px;background:#fff;color:#0F1F17}
.btns{display:grid;gap:10px;margin-top:14px}
.btns a,.btns button{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:8px;font:inherit;font-weight:700;font-size:1.05rem;text-decoration:none;border:0;cursor:pointer;color:#fff}
.wa{background:#1DAA57}
.sms{background:#0F1F17}
.btns .copy{background:#FFD21F;color:#0F1F17}
.note{color:rgba(255,255,255,.7);font-size:.85rem;margin-top:16px}
:focus-visible{outline:3px solid #FFD21F;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Send learner details</h1>
<p class="lead">Check the message, then choose how to send it. You pick the instructor in the next step.</p>
<div class="card">
<label for="msg">Message</label>
<textarea id="msg"></textarea>
<div class="btns">
<a id="wa" class="wa" href="#">Send on WhatsApp</a>
<a id="sms" class="sms" href="#">Send by text message (SMS)</a>
<button id="copy" class="copy" type="button">Copy message</button>
</div>
</div>
<p class="note">These details come from the link in your enquiry email and stay on this phone. Nothing on this page is saved or sent to the website.</p>
</main>
<script>
(function(){
var box = document.getElementById('msg'), wa = document.getElementById('wa'), sms = document.getElementById('sms'), copy = document.getElementById('copy');
var text = '';
try { text = decodeURIComponent(location.hash.slice(1)); } catch(e) { text = ''; }
box.value = text || 'No learner details were found. Open this page from the link in an enquiry email.';
var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function links(){
var enc = encodeURIComponent(box.value);
wa.href = 'https://wa.me/?text=' + enc;
sms.href = (ios ? 'sms:&body=' : 'sms:?body=') + enc;
}
links(); box.addEventListener('input', links);
copy.addEventListener('click', function(){
var done = function(){ copy.textContent = 'Copied'; setTimeout(function(){ copy.textContent = 'Copy message'; }, 2000); };
if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(box.value).then(done, function(){ box.select(); document.execCommand('copy'); done(); }); }
else { box.select(); document.execCommand('copy'); done(); }
});
})();
</script>
</body>
</html>
